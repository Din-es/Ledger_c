name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ${{ matrix.os }}
    strategy:
      # Report every platform. Without this, one failure cancels the others and
      # hides whether the bug is platform-specific — which is exactly the thing
      # a matrix exists to tell you.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0     # the tests build real git repos
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
      - name: gofmt
        if: matrix.os == 'ubuntu-latest'
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi
      - run: go vet ./...
      - run: go test ./...

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - name: obsidian plugin
        working-directory: obsidian-plugin
        run: npm install && npm run build
      - name: vscode extension
        working-directory: vscode-extension
        run: npm install && npx tsc -p ./
