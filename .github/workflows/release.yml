name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"

      - name: test
        run: go test ./...

      - name: build every platform
        run: |
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME#v}"
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os="${target%/*}"; arch="${target#*/}"
            out="dist/ledger_${VERSION}_${os}_${arch}"
            ext=""
            if [ "$os" = "windows" ]; then ext=".exe"; fi
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags "-s -w" -o "$out$ext" ./cmd/ledger
            ( cd dist && \
              if [ "$os" = "windows" ]; then zip -q "$(basename "$out").zip" "$(basename "$out")$ext"
              else tar -czf "$(basename "$out").tar.gz" "$(basename "$out")"; fi )
          done
          ( cd dist && sha256sum *.tar.gz *.zip > checksums.txt )
          ls -la dist

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
          generate_release_notes: true

  vscode-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: package the extension
        working-directory: vscode-extension
        run: |
          npm install
          npx tsc -p ./
          npx --yes @vscode/vsce package --out decision-ledger.vsix

      - uses: actions/upload-artifact@v5
        with:
          name: vscode-extension
          path: vscode-extension/decision-ledger.vsix

  obsidian-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"

      # The community-plugin store expects these three files loose on the
      # release, not zipped.
      - name: build the plugin
        working-directory: obsidian-plugin
        run: |
          npm install
          npm run build

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            obsidian-plugin/main.js
            obsidian-plugin/manifest.json
            obsidian-plugin/styles.css
